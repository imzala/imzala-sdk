            type: string
            format: uuid
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DemandStatus'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Demands
      summary: Sözleşme sil (yalnızca tamamlanmamış)
      x-required-scope: demands:write
      description: |
        Tamamlanmamış sözleşmeyi ve ilişkili tüm verilerini siler. 🔴
        Tamamlanmış (COMPLETED) sözleşme API'den SİLİNEMEZ (imzalı belge +
        denetim izi kaybı geri alınamaz) → 409 `DEMAND_COMPLETED`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Silindi
