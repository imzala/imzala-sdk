            `VALIDATION_FAIL` (başlık boş) · `INVALID_DOC_KIND` ·
            `CONSENT_CANNOT_BE_REQUIRED` / `PREINFO_MUST_BE_REQUIRED` — yamadan
            SONRA etkin `doc_kind`+`is_required` çiftine göre kontrol edilir
            (tek alanı yamalayıp kuralı atlatmak mümkün değildir).
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ENVELOPE_MULTI_DOC_DISABLED` / `DEMAND_NOT_EDITABLE` / `SIGNING_ALREADY_STARTED`.'
    delete:
