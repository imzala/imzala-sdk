        (400 `INVALID_PARTY_ID` — çapraz-sözleşme id kabul edilmez).

        Zaten karar vermiş (onaylamış/reddetmiş) bir imzacının ataması
        kaldırılamaz (400 `ASSIGNMENT_HAS_DECISION`).
      parameters:
