  /api/v1/timestamps:
    get:
      tags:
        - Timestamps
      summary: Zaman damgası listesi
      x-required-scope: timestamps
      description: |
        Hesabın (workspace) manuel oluşturduğu zaman damgalarını listeler.
        Sözleşme tamamlanınca otomatik üretilen damgalar bu listede GÖSTERİLMEZ
        (onlar ilgili sözleşme sayfasından indirilir). Yalnızca API key'in kendi
        workspace'indeki kayıtlar döner (IDOR-safe).

        `timestamp_file_url` doğrudan tarayıcıdan indirilebilir bir bağlantı
        DEĞİLDİR (dahili depolama anahtarı / şifreli olabilir).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            minimum: 10
            maximum: 100
        - name: q
          in: query
          schema:
            type: string
          description: Dosya adı / açıklamada arama (max 100 karakter)
        - name: status
          in: query
          schema:
            type: string
          description: 'Virgülle ayrılmış durum filtresi: ACTIVE,VERIFIED,EXPIRED,INVALID'
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Damga günü alt sınırı (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Damga günü üst sınırı (YYYY-MM-DD)
        - name: sort
          in: query
          schema:
            type: string
            default: '-createdAt'
          description: >-
            Sıralama: createdAt | timestamp_date | original_file_name | original_file_size | status
            ('-' öneki azalan)
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      timestamps:
                        type: array
                        items:
                          $ref: '#/components/schemas/TimestampListItem'
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: INSUFFICIENT_SCOPE — API key'de timestamps scope yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
        - Timestamps
      summary: Zaman damgası oluştur (eser tescil)
      x-required-scope: timestamps
      description: |
        Dosyanın SHA-256 hash'ini RFC 3161 standardında TÜBİTAK KAMU SM TSA ile
        imzalar ve bir zaman damgası kaydı oluşturur.

        **Damga neyi kanıtlar:**
        - Dosyanın bu tarih ve saatte var olduğunu (varlık kanıtı)
        - Dosya içeriğinin o andan bu yana değişmediğini (bütünlük kanıtı)

        **Damga neyi kanıtlamaz:**
        - Dosyanın kim tarafından yazıldığını (yazarlık kanıtı DEĞİL)
        - `owner_first_name` / `owner_last_name` alanları bilgilendirme amaçlıdır;
          sahiplik beyanı kullanıcı tarafından yapılır, API tarafından doğrulanmaz.

        Damga elektronik imza DEĞİLDİR. Nitelikli elektronik imza (QES) için
        ayrı imzalama akışını kullanın.

        **İdempotency:** `Idempotency-Key` header'ı (UUID önerilir) ile aynı
        istek tekrar gönderilirse 5 dakika içinde aynı `id` döner, yeni damga
        alınmaz ve kredi kesilmez.

        **İki içerik formatı desteklenir:**
        - `multipart/form-data`: `file` alanıyla ikili dosya yükleme
        - `application/json`: `file_base64` alanıyla standart Base64 (RFC 4648 §4,
          canonical alfabe — data URL öneki veya URL-safe alfabe kabul edilmez)
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: |
            Tekrar eden istekleri önlemek için istemci tarafında üretilen benzersiz
            anahtar (UUID önerilir). 5 dakika içinde aynı key ile yapılan istek
            önceki sonucu döner; yeni damga alınmaz, kredi kesilmez.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Damgalanacak dosya (maks. 50 MB)
                description:
                  type: string
                  description: Kayıt açıklaması (opsiyonel, max 500 karakter)
                owner_first_name:
                  type: string
                  description: Dosya sahibinin adı (opsiyonel, kullanıcı beyanı)
                owner_last_name:
                  type: string
                  description: Dosya sahibinin soyadı (opsiyonel, kullanıcı beyanı)
          application/json:
            schema:
              type: object
              required:
                - file_base64
                - file_name
              properties:
                file_base64:
                  type: string
                  description: |
                    Standart Base64 kodlanmış dosya içeriği (RFC 4648 §4 —
                    A-Za-z0-9+/ alfabesi, '=' padding). data URL öneki
                    (`data:...;base64,`) ve URL-safe alfabe (`-_`) kabul edilmez.
                file_name:
                  type: string
                  description: Orijinal dosya adı (uzantısıyla, ör. "belge.pdf")
                description:
                  type: string
                  description: Kayıt açıklaması (opsiyonel, max 500 karakter)
                owner_first_name:
                  type: string
                  description: Dosya sahibinin adı (opsiyonel, kullanıcı beyanı)
                owner_last_name:
                  type: string
                  description: Dosya sahibinin soyadı (opsiyonel, kullanıcı beyanı)
      responses:
        '201':
          description: Zaman damgası oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TimestampRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Yetersiz kredi (INSUFFICIENT_CREDITS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: INSUFFICIENT_SCOPE — API key'de timestamps scope yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: |
            UNSUPPORTED_MIME_TYPE — Yüklenen dosyanın MIME türü zaman damgası
            allowlist'inde değil (belge/görsel/ses/video dışı ya da içeriksiz
            `application/octet-stream`). İstemci doğru content-type göndermeli.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: |
            İstek içeriği işlenemedi. Olası kodlar:
            - `BAD_BASE64` — `file_base64` geçerli standart Base64 değil
            - `STAMP_INVALID` — TSA yanıtı geçersiz zaman damgası döndü
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit aşıldı (60 istek/dakika per API key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: |
            INDETERMINATE — Damga alındı ancak doğrulama sonucu belirsiz. Destek
            ekibiyle iletişime geçin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: |
            TSA_UNAVAILABLE — TÜBİTAK KAMU SM zaman damgası servisi geçici olarak
            erişilemiyor. Kısa süre sonra tekrar deneyin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
