  /api/v1/demands/{demandId}/documents:
    get:
      tags:
        - Demands
      summary: Zarf belge listesi
      x-required-scope: demands:read
      description: |
        Çok-belgeli imza zarfının belge listesini döner.

        🔴 Bu uç ve aşağıdaki tüm `/documents*` + `/documents/{docId}*` +
        `/documents/{docId}/assignments` uçları `ENVELOPE_DECISION_ENFORCE`
        bayrağı **arkasındadır**; bayrak kapalıyken **409
        `ENVELOPE_MULTI_DOC_DISABLED`** döner. Bu, dashboard'un davranışından
        BİLEREK daha katıdır: dashboard yalnız yazma uçlarını kapatır, burada
        okuma da kapalıdır — kademeli açılış tamamlanmadan dış API çağıranına
        kararsız/tek-belgeye-indirgenmiş bir zarf durumu hiç gösterilmez.

        Belge uçları **kredi düşmez**; tahsilat yalnızca
        `POST /demands/{demandId}/dispatch` çağrıldığında yapılır.

        Varsayılan yanıt daraltılmış özet şeklidir. `?view=wizard` verilirse
        tam şekil döner (`EnvelopeDocument` şemasındaki alan notlarına bakın).
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: view
          in: query
          schema:
            type: string
            enum:
              - wizard
          description: '`wizard` → tam DTO (`assigned_party_ids` + `decision_count` dahil).'
      responses:
        '200':
          description: Belge listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      documents:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnvelopeDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ENVELOPE_MULTI_DOC_DISABLED` — çok-belgeli zarf yüzeyi bu hesap için henüz kapalı.'
    post:
      tags:
        - Demands
      summary: Zarfa metadata-only belge ekle
      x-required-scope: demands:write
      description: |
        Zarfa dosyasız (yalnız metadata) yeni bir belge satırı ekler; sıra
        numarası otomatik atanır (mevcut belge sayısı + 1). Dosyalı yükleme
        AYRI bir uçtur: `POST /demands/{demandId}/documents/upload`.

        Belge uçları kredi düşmez; tahsilat `POST /dispatch`'te yapılır.
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: Belge başlığı. Boş olamaz.
                doc_kind:
                  type: string
                  enum:
                    - CONTRACT
                    - KVKK_NOTICE
                    - KVKK_CONSENT
                    - PREINFO
                    - PRICE_LIST
                    - OTHER
                  default: OTHER
                  description: |
                    `KVKK_CONSENT` ile `is_required: true` **birlikte
                    gönderilemez** (400 `CONSENT_CANNOT_BE_REQUIRED` — açık
                    rıza reddedilebilir olmak zorundadır). `PREINFO` ile
                    `is_required: false` **birlikte gönderilemez** (400
                    `PREINFO_MUST_BE_REQUIRED`).
                is_required:
                  type: boolean
                  default: true
                signature_required:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Belge oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/EnvelopeDocument'
        '400':
          description: |
            `VALIDATION_FAIL` — başlık boş. `INVALID_DOC_KIND` — geçersiz
            `doc_kind`. `CONSENT_CANNOT_BE_REQUIRED` / `PREINFO_MUST_BE_REQUIRED`
            — yukarı bakın. `DOCUMENT_LIMIT_EXCEEDED` — zarf başına en fazla
            20 belge. `QES_NOT_SUPPORTED_MULTI_DOCUMENT` — NES/Mobil İmza açık
            (`enable_qes`) bir sözleşmede ikinci belge eklenemez.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `ENVELOPE_MULTI_DOC_DISABLED` — bayrak kapalı.
            `DEMAND_NOT_EDITABLE` — sözleşme düzenlemeye açık değil (iptal/
            süresi geçmiş/bulunamadı). `SIGNING_ALREADY_STARTED` — imza
            süreci başlamış zarfın belge listesi değiştirilemez (biri
            görüntülemiş/imzalamış/karar vermiş).
  /api/v1/demands/{demandId}/documents/upload:
    post:
      tags:
        - Demands
      summary: Zarfa dosya yükle (belge başına tek dosya)
      x-required-scope: demands:write
      description: |
        Zarfa **belge başına tek dosya** yükler. Aynı sözleşmeye birden çok
        belge eklemek için bu uç birden çok kez çağrılır — tek istekte N
        belge YASAKTIR.

        `idempotency_key` **zorunludur** (gövde alanı; `Idempotency-Key`
        HEADER'ı ile KARIŞTIRILMAZ, ayrı bir mekanizmadır). Aynı
        `(demandId, idempotency_key)` çifti ile tekrar çağrı **409
        `IDEMPOTENT_REPLAY`** döner ve **yeni belge YARATILMAZ**; yanıt
        gövdesinde daha önce yüklenen belgenin DTO'su döner.

        Belge uçları kredi düşmez; tahsilat `POST /dispatch`'te yapılır.
      parameters:
        - name: demandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - idempotency_key
                - title
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF/DOC/DOCX/ODT/RTF/TXT veya görsel. Tek dosya.
                idempotency_key:
                  type: string
                  description: Zorunlu tekrar-koruma anahtarı.
                title:
                  type: string
                doc_kind:
                  type: string
                  enum:
                    - CONTRACT
                    - KVKK_NOTICE
                    - KVKK_CONSENT
                    - PREINFO
                    - PRICE_LIST
                    - OTHER
                  default: OTHER
                is_required:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  default: 'true'
                  description: Multipart alanı — string olarak gönderilir.
      responses:
        '200':
          description: Belge yüklendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/EnvelopeDocument'
        '400':
          description: '`VALIDATION_FAIL` (dosya/idempotency_key/başlık eksik) veya `INVALID_DOC_KIND`.'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `ENVELOPE_MULTI_DOC_DISABLED` — bayrak kapalı.
            `IDEMPOTENT_REPLAY` — aynı `idempotency_key` daha önce kullanıldı,
            yeni belge yaratılmaz (gövdede mevcut belgenin `document`'ı döner).
            `DEMAND_NOT_EDITABLE` / `SIGNING_ALREADY_STARTED` — bkz. yukarıdaki uç.
        '413':
          description: '`FILE_TOO_LARGE` — 20 MB sınırı.'
        '415':
          description: Desteklenmeyen dosya türü.
        '422':
          description: '`IMAGE_DECODE_FAILED` — görsel çözümlenemedi.'
