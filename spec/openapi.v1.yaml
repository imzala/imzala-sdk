  /api/v1/demands/bulk:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags:
        - Demands
      summary: Toplu sözleşme oluştur (tek şablondan N alıcı)
      x-required-scope: demands:write
      description: |
        Tek şablondan en fazla 10 alıcıya AYRI AYRI sözleşme oluşturur ve
        her birine imza daveti gönderir (DocuSign "bulk send" modeli). Her
        satır bağımsız bir sözleşmedir; satır-başı kısmi başarı raporlanır.

        **Davranış:**
        - `rows` en fazla 10 (aşarsa 400 `BULK_MAX_10`). Daha büyük listeler
          istemci tarafında 10'arlı parçalara bölünür.
        - Kredi: sabit "1 satır = 1 kredi" değildir, her satırın maliyeti
          `POST /demands` ile AYNI formülle hesaplanır (imza sınıfı taban
          ücreti + doğrulama yöntemi ek maliyetleri + PAdES seviye ek
          maliyeti, imzacı sayısıyla çarpılır; `eidas_timestamp` seçilirse
          satır başına +1 kredi eklenir). PAdES seviye eki yalnız QES'te
          uygulanır: B-T +0, B-LT +0, **B-LTA +1**. Doğrulama yöntemlerinden
          `ocr_id` ve `liveness` +1 kredi, diğerleri 0'dır. `options`
          batch-seviye geçerlidir ve şablon varsayılanını ezer. İstek başında N satırın
          toplam maliyeti için yeterlilik kontrol edilir (yetersizse 402,
          hiçbir sözleşme yaratılmaz); ayrıca her satır kendi maliyeti için
          tekrar kontrol edilir; kredi satır oluşturma sırasında
          tükenirse o satır `failed` (`error: "INSUFFICIENT_CREDITS"`)
          olarak işaretlenir, batch devam eder. Nadir bir yarışta (satır
          oluşturulduktan hemen sonra kredi mutabakatı reddederse) o satır
          yine `failed` döner ama sözleşme zaten oluşturulmuş taslak
          olarak kalır (`demand_id` response'ta bulunur, davet
          gönderilmemiştir).
        - Şablon sahipliği istek başında bir kez doğrulanır (workspace-scoped;
          başka workspace'in şablonu 404).
        - Kısmi başarı normaldir: batch tamamlanınca HTTP 200 döner (bazı
          satırlar `failed` olsa bile). Yalnızca ön-kontrol redleri
          (cap/kredi/sahiplik) 400/402/404 döner.
        - `X-Workspace-Id` header'ı ile organizasyon workspace'i seçilebilir.

        Rate limit: 5 istek/dakika (API key başına).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - template_id
                - rows
              properties:
                template_id:
                  type: string
                  format: uuid
                  description: Sözleşmelerin oluşturulacağı şablon
                options:
                  type: object
                  description: Tüm satırlara uygulanan batch-seviye seçenekler (opsiyonel)
                  properties:
                    dispatch_notifications:
                      type: boolean
                      default: true
                      description: false ise davet gönderilmez (yalnızca oluşturulur)
                    ordered:
                      type: boolean
                      description: true ise taraflar sırayla imzalar
                    sms_content:
                      type: string
                      description: SMS davet metni özelleştirmesi (yalnızca kendi SMS sağlayıcısı olan org'lar)
                    language:
                      type: string
                      example: tr
                    enable_qes:
                      type: boolean
                      description: >-
                        🔴 Faturayı etkiler. Nitelikli imza (QES) sınıfı; imzacı başına taban ücret
                        1 yerine 2 kredi.
                    qes_pades_level:
                      type: string
                      enum:
                        - PAdES_BASELINE_T
                        - PAdES_BASELINE_LT
                        - PAdES_BASELINE_LTA
                      description: >-
                        🔴 Faturayı etkiler. Yalnız enable_qes ile anlamlıdır: B-T +0, B-LT +0,
                        B-LTA +1 kredi (imzacı başına).
                    eidas_timestamp:
                      type: boolean
                      description: >-
                        🔴 Faturayı etkiler. AB nitelikli zaman damgası; satır (sözleşme) başına +1
                        kredi.
                    require_id_photo:
                      type: boolean
                      description: 🔴 Faturayı etkiler. Kimlik fotoğrafı doğrulaması; imzacı başına +1 kredi.
                    require_liveness_check:
                      type: boolean
                      description: 🔴 Faturayı etkiler. Canlılık doğrulaması; imzacı başına +1 kredi.
                rows:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: Her biri ayrı bir sözleşme olacak satırlar (en fazla 10)
                  items:
                    type: object
                    required:
                      - party_mapping
                    properties:
                      party_mapping:
                        type: array
                        description: Bu satırın taraf eşlemesi (POST /demands ile aynı şekil)
                        items:
                          type: object
                          properties:
                            template_party_id:
                              type: string
                              format: uuid
                            first_name:
                              type: string
                            last_name:
                              type: string
                            email:
                              type: string
                              format: email
                            phone:
                              type: string
                              description: >-
                                E.164 biçiminde telefon (ör. `+905551234567`). Ülke kodu ile
                                birlikte gönderin; fazlalık şehirlerarası öneki (TRde baş sıfır,
                                `+90 0542…`) sunucuda kaldırılır ve numara kanonik E.164 biçiminde
                                saklanır. Tanınmayan girdi olduğu gibi korunur ama SMS teslim
                                edilemeyebilir.
                            government_id:
                              type: string
                              description: T.C. kimlik numarası (11 hane)
                            birth_date:
                              type: string
                              format: date
                              description: ISO 8601 (ör. 1990-05-15)
                            send_sms:
                              type: boolean
                              default: true
                            send_email:
                              type: boolean
                              default: true
                            custom_message:
                              type: string
                              description: Bu tarafa özel davet mesajı
                            variables:
                              type: object
                              description: Bu tarafa özel değişkenler
                      variables:
                        type: object
                        description: Satır-kök değişkenler
      responses:
        '200':
          description: |
            Batch tamamlandı (kısmi başarı dahil). `results` giriş sırasında,
            her satır `row_index` ile eşlenir.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      template_id:
                        type: string
                        format: uuid
                      total:
                        type: integer
                        example: 3
                      created:
                        type: integer
                        example: 2
                      failed:
                        type: integer
                        example: 1
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            row_index:
                              type: integer
                            status:
                              type: string
                              enum:
                                - created
                                - failed
                            demand_id:
                              type: string
                              format: uuid
                              description: >-
                                status=created ise; veya status=failed olup sözleşme oluşturulduktan
                                SONRA kredi mutabakatı reddettiyse (taslak, davet gönderilmedi)
                            signing_urls:
                              type: array
                              items:
                                type: object
                                properties:
                                  party_id:
                                    type: string
                                    format: uuid
                                  first_name:
                                    type: string
                                  last_name:
                                    type: string
                                  email:
                                    type: string
                                  phone:
                                    type: string
                                  signing_url:
                                    type: string
                                    format: uri
                            result_url:
                              type: string
                              format: uri
                            dispatched:
                              type: integer
                              description: Gönderilen davet (SMS+e-posta) sayısı
                            error:
                              type: string
                              description: >-
                                status=failed ise makinece okunabilir kod (VALIDATION,
                                INSUFFICIENT_CREDITS, MEMBER_LIMIT_EXCEEDED, CREATE_FAILED vb.)
                            message:
                              type: string
                              description: status=failed ise açıklama
        '400':
          description: |
            Geçersiz istek. Olası kodlar: `BULK_MAX_10` (`rows` 10'dan fazla),
            boş `rows`, eksik `template_id`, `INVALID_PADES_LEVEL`
            (`options.qes_pades_level` satılabilir seviyelerden biri değil),
            `FIELD_LAYOUT_TEMPLATE_NOT_SENDABLE` (verilen kimlik bir Alan
            Şablonuna ait). AB nitelikli zaman damgası hesabınızda kapalıyken
            `eidas_timestamp` gönderilirse de 400 döner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: |
            INSUFFICIENT_CREDITS: N satırın toplam tahmini maliyeti için
            yeterli kredi yok (ön kontrol; hiçbir sözleşme yaratılmadı).
            Satır bazlı yetersiz kredi durumları burada DEĞİL, 200 yanıtı
            içindeki `results[].status: "failed"` altında döner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: INSUFFICIENT_SCOPE (demands:write yok) veya SMS_CUSTOMIZATION_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `QES_NOT_SUPPORTED_MULTI_DOCUMENT`: nitelikli imza (QES) birden
            çok belge içeren zarflarda henüz desteklenmiyor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: İstek limiti aşıldı (API anahtarı başına 5 toplu istek/dakika)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/demands/{id}:
    get:
      tags:
        - Demands
