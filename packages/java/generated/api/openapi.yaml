  /api/v1/demands/{demandId}/dispatch:
    post:
      description: |
        Sözleşmeyi imzaya gönderir: kredi mutabakatı yapar, `DRAFT` ise
        sözleşmeyi `PENDING`'e alır ve tarafları imza daveti (SMS/e-posta/
        WhatsApp) ile bilgilendirir.

        🔴 **Bu uçta yukarıdaki `/documents*` ailesinin bayrak kapısı
        (`ENVELOPE_DECISION_ENFORCE`) YOKTUR** (bilinçli): gönderim
        tek-belgeli zarflarda da anlamlıdır; o bayrak yalnız çok-belgeli zarf
        YARATIMINI kapatan bir anahtardır.

        **İki aşamalı akış örneği:** bir sözleşme önce sessizce hazırlanabilir
        — `dispatch_notifications: false` ile oluşturulur, ardından
        `POST .../documents` / `POST .../documents/upload` ile belgeler
        eklenir (bu iki uç kimseye bildirim GÖNDERMEZ; `send_invitations`
        gibi bir parametreleri bile yoktur) — çağıran hazır olduğunda TEK bu
        uçla yayına alıp davetleri gönderir. **Bu uç çağrılana kadar** birden
        çok belgeli bir zarfın oluşturma yanıtındaki `signing_url`'leri
        ÇALIŞMAZ (imzacı için 410; `POST .../parties/{partyId}/resend` ve
        `POST .../reminders` için 409 `ENVELOPE_NOT_DISPATCHED` döner); belge
        uçları (`/documents*`) ise gönderim beklemeden kullanılabilir.

        **Kredi:** tek tahsilat noktası burasıdır (`reconcileDemandSigningCost`).
        Belge CRUD/yükleme uçları kredi düşmez. Mutabakat **idempotent**tir:
        sözleşme zaten yayınlanmışsa (`dispatched: false` döner) fark 0
        olduğu için tekrar tahsilat YAPILMAZ — ama davet fazı yine çalışır
        (bkz. `v1ResendRateLimiter`, `/parties/{partyId}/resend` ile AYNI
        dakika-bazlı freni paylaşır).
      parameters:
      - explode: false
        in: path
        name: demandId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_demands__demandId__dispatch_post_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands__demandId__dispatch_post_200_response"
          description: Yayına alındı (veya zaten yayındaydı) + davet sonucu
        "400":
          description: '`INVALID_SEND_INVITATIONS` — tanınmayan `send_invitations`
            değeri.'
        "402":
          description: |
            Kredi mutabakatı başarısız — sözleşme yayına GEÇMEZ, davet
            gönderilmez.
            `INSUFFICIENT_CREDITS` — hesabın/organizasyonun kredisi yetmiyor.
            `MEMBER_LIMIT_EXCEEDED` — organizasyon üyesinin aylık kredi
            limiti aşıldı (kredi havuzunda bakiye olsa bile).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates__id__get_404_response"
          description: Kayıt bulunamadı
        "409":
          description: |
            `DEMAND_EXPIRED` — sözleşmenin imza süresi geçmiş.
            `DEMAND_NOT_DISPATCHABLE` — tamamlanmış/iptal edilmiş sözleşme
            tekrar yayınlanamaz.
            `DISPATCH_NO_PARTIES` — sözleşmede hiç imzacı taraf yok. Zarf
            tamamlanamayacağı için yayına ALINMAZ; kredi dokunulmaz, statü
            değişmez, `demand.dispatched` olayı yayılmaz. Önce
            `POST /demands/{demandId}/parties` ile taraf ekleyin.
            `DISPATCH_TOO_MANY` — taraf sayısı 20'yi aşıyor. İstek hiçbir yan
            etki bırakmadan reddedilir (kredi düşmez, sözleşme yayına
            geçmez); sözleşmeyi tarafları azaltarak gönderin veya davetleri
            `/parties/{partyId}/resend` ile tek tek yollayın.
            `PARTY_WITHOUT_DOCUMENTS`: çok belgeli zarfta eşlenen bir taraf
            hiçbir belgeye atanmamış. Kredi ve iddiadan ÖNCE, yan etkisiz
            kontrol edilir (kredi dokunulmaz, statü değişmez, davet gitmez);
            gövdede atamasız taraf id'leri `party_ids` içinde döner.
            `PUT .../documents/{docId}/assignments` ile atamayı tamamlayıp
            tekrar deneyin.
            `ENVELOPE_CHANGED_DURING_DISPATCH`: kredi mutabakatı ile
            gönderim iddiası arasında zarf değiştirildi (ör. eşzamanlı bir
            istek belge/atama ekledi). Sunucu bunu kilit altında bir kez
            kendiliğinden yeniden dener; ikinci denemede de olursa bu kod
            döner. Sözleşme yayına GEÇMEDİ; istek güvenle tekrarlanabilir.
        "429":
          description: |
            Tekrar-gönderim hız sınırı aşıldı — bu uç
            `/parties/{partyId}/resend` ile AYNI anahtar-bazlı freni paylaşır.

            `TOO_MANY_REQUESTS`: API anahtarı başına saatte 300 istek. Gövdede
            `retry_after_seconds` döner.
        "500":
          description: |
            `RECONCILE_FAILED` — kredi mutabakatı beklenmedik bir hatayla
            düştü. Sözleşme yayına GEÇMEZ ve davet gönderilmez; istek güvenle
            tekrarlanabilir (mutabakat idempotenttir).
      summary: Zarfı imzaya gönder (yayınla + davet)
      tags:
      - Demands
      x-required-scope: demands:write
      x-content-type: application/json
      x-accepts:
      - application/json
