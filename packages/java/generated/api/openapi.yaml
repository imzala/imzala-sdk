    WebhookDataPartyViewed:
      properties:
        demand_id:
          format: uuid
          type: string
        party_id:
          format: uuid
          type: string
      required:
      - demand_id
      - party_id
      type: object
    WebhookDataPartyRejected:
      properties:
        demand_id:
          format: uuid
          type: string
        party:
          $ref: "#/components/schemas/WebhookDataPartyRejected_party"
        rejected_at:
          format: date-time
          type: string
      required:
      - demand_id
      - party
      - rejected_at
      type: object
    WebhookDataContractTerm:
      description: |
        `contract.expiring` / `contract.ended` / `contract.advanced`
        olaylarının ortak verisi. Yalnız takip alanlarını taşır; taraf adı,
        e-postası veya sözleşme başlığı BU GÖVDEDE YER ALMAZ.
      properties:
        demand_id:
          format: uuid
          type: string
        term_end_date:
          description: Olay anında platformda kayıtlı takip bitiş tarihi.
          format: date
          nullable: true
          type: string
        renewal_type:
          enum:
          - AUTO_RENEW
          - FIXED_TERM
          nullable: true
          type: string
        notice_deadline:
          description: İhbar için son gün (`term_end_date - notice_days`); tanımsızsa
            `null`.
          format: date
          nullable: true
          type: string
        term_state:
          description: Olay anındaki takip durumu (bkz. `ContractTerm.state`).
          enum:
          - UNTRACKED
          - ACTIVE
          - ENDED
          - STOPPED
          type: string
        due_key:
          description: |
            İşçinin tekillik anahtarı (aynı olayı tekrar göndermemek için
            kullandığı dahili kayıt). Formatı sabit değildir, opak string
            olarak ele alın; idempotency için `id` alanını kullanın.
          nullable: true
          type: string
      required:
      - demand_id
      - due_key
      - notice_deadline
      - renewal_type
      - term_end_date
      - term_state
      type: object
    KycWebhookEnvelope:
      description: |
        KYC olaylarının zarfı. Sözleşme olaylarıyla aynı alanları taşır;
        `type` enum'u yalnız KYC olaylarını içerir.
      properties:
        id:
          description: "Olay id'si: receiver tarafında idempotency anahtarı."
          example: evt_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
          pattern: "^evt_[0-9a-f]{32}$"
          type: string
        type:
          enum:
          - kyc.completed
          - kyc.failed
          type: string
        created_at:
          description: Olay zamanı (ISO 8601 UTC).
          format: date-time
          type: string
        data:
          description: Olay verisi (WebhookDataKycTerminal)
          type: object
      required:
      - created_at
      - data
      - id
      - type
      type: object
    WebhookDataKycTerminal:
      description: |
        KYC terminal olay verisi. Yalnız doğrulamanın sonucunu taşır: kimlik
        numarası, telefon, ad soyad ve belge görüntüleri bu gövdede YER ALMAZ.
      properties:
        id:
          description: |
            Doğrulama kaydının kimliği. Talep oluşturulurken dönen kimlikle
            aynıdır; aynı doğrulamaya ait olayları bu değerle ilişkilendirin.
          format: uuid
          type: string
        verified:
          description: Doğrulamanın toplam sonucu.
          type: boolean
        methods:
          description: "Talepte istenen yöntemler (örn. `id_card`, `phone_otp`)."
          items:
            type: string
          type: array
        steps:
          items:
            $ref: "#/components/schemas/WebhookDataKycTerminal_steps_inner"
          type: array
        external_ref:
          description: Talep oluşturulurken verilen dış referans.
          nullable: true
          type: string
      required:
      - external_ref
      - id
      - methods
      - steps
      - verified
      type: object
    CodedError:
      description: |
        `error` alanında insan-okur mesaj, `code` alanında makinece okunur
        hata kodu taşıyan hata gövdesi. Hangi kodların döndüğü ilgili yanıtın
        açıklamasında listelenir.
      example:
        success: false
        error: Geçersiz sayfa numarası (page >= 1 olmalı)
        code: INVALID_PAGE
        field: field
      properties:
        success:
          example: false
          type: boolean
        error:
          example: Geçersiz sayfa numarası (page >= 1 olmalı)
          type: string
        code:
          example: INVALID_PAGE
          type: string
        field:
          description: |
            Bazı kodlarda (ör. `TERM_INVALID`) hangi alanın reddedildiğini
            gösterir. Yalnız bu tür kodlarda bulunur; her hata gövdesinde
            YOKTUR.
          nullable: true
          type: string
      type: object
    StandardError:
      description: |
        `code`/`message` formatında standart hata gövdesi. Reminder trigger
        (`POST /api/v1/demands/{id}/reminders`) bu formatı kullanır.
      example:
        success: false
        error:
          code: DEMAND_NOT_FOUND
          message: Demand not found
          retry_after_seconds: 247
      properties:
        success:
          example: false
          type: boolean
        error:
          $ref: "#/components/schemas/StandardError_error"
      type: object
    TimestampRecord:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        timestamp_time: 2000-01-23T04:56:07.000+00:00
        tsa_authority: TÜBİTAK KAMU SM
        file_sha256: a3f8b1c2d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
        verify_url: https://imzala.org/dogrula?seri=<id>
        certificate_url: https://imzala.org/dogrula?seri=<id>
        credits_used: 4
        credits_remaining: 0
      properties:
        id:
          format: uuid
          type: string
        timestamp_time:
          description: TÜBİTAK KAMU SM'nin onayladığı damga zamanı (UTC)
          format: date-time
          type: string
        tsa_authority:
          description: Zaman damgası sağlayıcısı
          example: TÜBİTAK KAMU SM
          type: string
        file_sha256:
          description: "Damgalanan dosyanın SHA-256 hash değeri (hex, 64 karakter)"
          example: a3f8b1c2d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
          type: string
        verify_url:
          description: Damgayı doğrulamak için URL
          example: https://imzala.org/dogrula?seri=<id>
          format: uri
          type: string
        certificate_url:
          description: Damga sertifikası URL'i
          example: https://imzala.org/dogrula?seri=<id>
          format: uri
          type: string
        credits_used:
          description: Bu damga için harcanan kredi miktarı
          example: 4
          type: integer
        credits_remaining:
          description: İşlem sonrası kalan kredi bakiyesi
          example: 0
          type: integer
      type: object
    ApiError:
      description: |
        Standart hata zarfı. `success: false`, `error` makinece okunabilir
        hata kodu, `message` kullanıcıya dönük açıklama.
      example:
        success: false
        error: INSUFFICIENT_CREDITS
        message: Yeterli krediniz yok
        code: RATE_LIMIT_EXCEEDED
        retry_after_seconds: 60
      properties:
        success:
          example: false
          type: boolean
        error:
          example: INSUFFICIENT_CREDITS
          type: string
        message:
          example: Yeterli krediniz yok
          type: string
        code:
          description: İstek limiti yanıtlarında `error` ile aynı kodu taşır; diğer
            yanıtlarda bulunmayabilir.
          example: RATE_LIMIT_EXCEEDED
          type: string
        retry_after_seconds:
          description: Yalnız 429 yanıtlarında; `Retry-After` başlığıyla aynı değer.
          example: 60
          type: integer
      type: object
    TimestampListItem:
      description: |
        Zaman damgası liste/detay öğesi. `timestamp_file_url` doğrudan
        indirilebilir bir bağlantı DEĞİLDİR (dahili depolama anahtarı olabilir).
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        original_file_name: original_file_name
        original_file_size: 0
        timestamp_date: 2000-01-23T04:56:07.000+00:00
        status: ACTIVE
        description: description
        created_at: 2000-01-23T04:56:07.000+00:00
        timestamp_file_url: timestamp_file_url
      properties:
        id:
