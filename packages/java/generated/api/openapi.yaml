                      address: Kiraya verenin adresi
                      iban: TR..01
                  - template_party_id: <kiraci-id>
                    first_name: Veli
                    last_name: Demir
                    email: veli@example.com
                    government_id: "10987654321"
                    variables:
                      address: Kiracının adresi
                      iban: TR..02
                  variables:
                    kira_baslangic_tarihi: 2026-06-01
                    kira_bedeli: 12.000 TL
                    depozito: 24.000 TL
              multiDocument:
                summary: "Çok belgeli zarf, belge başına değişken"
                value:
                  template_id: <zarf-template-id>
                  title: Hizmet Zarfı - Ayşe Yılmaz
                  party_mapping:
                  - template_party_id: <musteri-id>
                    first_name: Ayşe
                    last_name: Yılmaz
                    email: ayse@example.com
                    phone: "+905551112233"
                    variables:
                      adres: "Atatürk Cad. No: 12, Çankaya/Ankara"
                    document_variables:
                      <hizmet-sozlesmesi-belge-id>:
                        tutar: 10.000 TL
                      <bakim-eki-belge-id>:
                        tutar: 2.500 TL
                  variables:
