  /api/v1/demands/{id}/reminders:
    post:
      description: |
        Sözleşmenin **henüz imzalamamış** taraflarına SMS ve/veya e-posta
        hatırlatması anlık olarak gönderir. Şablon-/sözleşme-seviyesi
        `reminder_settings` ayarından **bağımsız** olarak çalışır — istediğiniz
        zaman elle tetiklenebilir.

        **Kimlere gitmez:** İmzayı reddetmiş, onayını vermiş, açık düzeltme
        talebi olan, imza alanı olmayan (bilgi tarafı) taraflara ve imza ekranı
        henüz açılmamış taraflara (sıralı imzada sırası gelmemiş; onay bekleyen
        bir onaylayan varken imzacılar) hatırlatma gönderilmez; bu taraflar
        `details[]` içinde yer almaz, sayıları `reminders_ineligible` alanında
        döner. Onay bekleyen onaylayan hatırlatma alır. Çok belgeli zarfta bir
        taraf, zarftaki tüm belgelere kararını verene kadar hatırlatma almaya
        devam eder.

        **Anti-spam koruması:** Aynı sözleşme için son hatırlatmanın üzerinden
        5 dakika geçmemişse 429 `RATE_LIMITED` döner ve `Retry-After` header'ı
        ile `retry_after_seconds` alanı bilgilendirir. Override için body'de
        `force: true` yollayın (yanlışlıkla spam atmamak için kasıtlı kullanın).

        **Kişi başına sert sınırlar (override edilemez):** Spam ve gönderici
        reputasyon koruması için kişi-başına reminder sayısı sınırlıdır:

        - **Bir kişiye en fazla 3 SMS reminder** gönderilebilir (otomatik
          scheduled + manuel trigger toplam). Sayaç dolu kişi için SMS skip
          edilir, `details[]` içinde `reason: "party_sms_cap_reached (3)"` görünür.
        - **Bir kişiye en fazla 3 e-posta reminder** gönderilebilir. Sayaç
          dolu kişi için email skip edilir, `reason: "party_email_cap_reached (3)"`.
        - Diğer kişilere gönderim normal şekilde devam eder; tek bir kişinin
          sayacı dolu diye tüm çağrı reddedilmez.
        - `force: true` 5dk anti-spam pencereyi override eder ama kişi-başı
          cap'i ASLA — sert kural.
        - Sözleşme başına global cap pratikte yok (`999` safety net) — kural
          kişi başınadır.

        Sayım kaynağı: `ReminderLog` tablosu (channel + party_id, `status='SENT'`).
        Hem otomatik scheduled (ReminderWorker) hem manuel trigger reminders
        tek toplamda sayılır.

        **Workspace izolasyonu:** `X-Workspace-Id` header'ıyla erişilen
        organizasyonun sözleşmesi olmalıdır; aksi halde 404 `DEMAND_NOT_FOUND`
        (IDOR shield).

        **Kanal eligibility:** Bir parti için
        - `email` kanalı: `party.email` dolu **ve** `party.send_email=true` **ve**
          `demand.send_email_notifications=true` ise gönderilir
        - `sms` kanalı: `party.phone` dolu **ve** `party.send_sms=true` **ve**
          `demand.send_sms_notifications=true` ise gönderilir

        **Mesaj içeriği:** Şablonun `sms_reminder_message` alanı (varsa) +
        `signer.first_name` / `{{name}}` / `{{link}}` gibi sistem değişkenleri
        substitute edilir. Şablonda yoksa sistem default reminder mesajı kullanılır.
      parameters:
      - description: Sözleşme (demand) ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              defaultBoth:
                summary: Default — SMS + e-posta birlikte
                value: {}
              smsOnly:
                summary: Sadece SMS gönder
                value:
                  channels:
                  - sms
              forceOverrideRateLimit:
                summary: 5 dk anti-spam penceresini override et (admin operasyonu)
                value:
                  channels:
                  - sms
                  - email
                  force: true
            schema:
              $ref: "#/components/schemas/TriggerReminderRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands__id__reminders_post_200_response"
          description: |
            Hatırlatma kuyruğa alındı. `data.dispatched` her parti için
            hangi kanallarda gönderildiğini gösterir.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
          description: |
            **INVALID_CHANNELS** — `channels` parametresi yollandı ama boş array
            veya `email`/`sms` dışı bir değer içeriyor.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates_get_401_response"
          description: API key geçersiz veya eksik
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
          description: |
            **DEMAND_NOT_FOUND** — Sözleşme bu workspace'te (ya da kişisel
            workspace'te) bulunamadı. IDOR koruması: başka org'un sözleşmesi
            için de bu cevap döner.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
          description: |
            **ALREADY_COMPLETED** — Tüm taraflar imzalamış. Hatırlatılacak
            imzalanmamış parti yok. İmzalamamış taraf varsa ama hiçbiri
            hatırlatma almıyorsa (ör. yalnız reddeden taraf kaldıysa) bu kod
            dönmez; yanıt 200 ve gönderim sayısı 0 olur.

            **DEMAND_NOT_DISPATCHED**: sözleşme henüz imzaya gönderilmedi (taslak).

            **DEMAND_NOT_DISPATCHABLE**: sözleşme tamamlanmış veya iptal edilmiş.

            **DEMAND_EXPIRED**: sözleşmenin imza süresi geçmiş.

            **ENVELOPE_NOT_DISPATCHED**: çok belgeli zarf henüz gönderilmedi.
            Önce `POST /demands/{id}/dispatch` çağırın; tek belgeli ve
            gönderilmiş sözleşmelerde bu kod hiç dönmez.
        "429":
          content:
            application/json:
              examples:
                rateLimited:
                  summary: 5 dk anti-spam pencere — retry edilebilir
                  value:
                    success: false
                    error:
                      code: RATE_LIMITED
                      message: Reminder rate limited. Try again in 247s or pass force=true.
                      retry_after_seconds: 247
                smsCapReached:
                  summary: SMS sert üst sınır — retry edilemez
                  value:
                    success: false
                    error:
                      code: MAX_SMS_REMINDERS_REACHED
                      message: This demand has already received 3 SMS reminders (max
                        3 per contract). SMS cap reached; further reminders blocked.
                        Email channel still allowed.
              schema:
                $ref: "#/components/schemas/_api_v1_demands__id__reminders_post_429_response"
          description: |
            **RATE_LIMITED** — Son hatırlatmadan 5 dk geçmedi. `Retry-After`
            header'ı + `retry_after_seconds` alanı bekleme süresini gösterir.
            Override için `force: true` ile tekrar deneyin.

            Not: Kişi-başı cap'ler 429 dönmez — o kişiyi `details[]` içinde
            `skipped` olarak işaretler ve diğer kişilere gönderime devam eder
            (200 success). MAX_SMS_REMINDERS_REACHED 429 yalnızca pratikte
            ulaşılmayan global demand cap (999) güvenlik ağı için tanımlı.
          headers:
            Retry-After:
              description: Saniye cinsinden bekleme süresi (sadece RATE_LIMITED)
              explode: false
              schema:
                type: integer
              style: simple
      summary: Anlık hatırlatma tetikle (imzalanmamış taraflara)
      tags:
      - Reminders
      x-required-scope: demands:write
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/demands/upload:
    post:
      description: |
        Multipart/form-data ile doğrudan dosya yükleyerek sözleşme oluşturur
        (şablon kullanmadan). Tek PDF/DOC/DOCX/ODT/RTF/TXT veya 1-20 görsel
        (JPG/PNG/HEIC/TIFF/WEBP) kabul eder; görseller sırayla tek PDF'e
        birleştirilir, office formatları LibreOffice ile PDF'e çevrilir.
      parameters:
      - description: |
          Çağıranın kendi referansı (sipariş / dosya numarası olabilir). Aynı API
          anahtarı + aynı anahtarla gelen İKİNCİ istek yeni sözleşme YARATMAZ:
          ilk sözleşme `reused: true` + `created_at` ile döner, kredi düşülmez,
          davet gönderilmez.

          🔴 Anahtar KALICIDIR (süre sınırı yoktur). Numaralandırmanızı yıl
          döngüsünde tekrar kullanıyorsanız yıl/ön ek ekleyin. Aynı anahtar
          FARKLI içerikle gelirse `409 IDEMPOTENCY_KEY_REUSED` döner.

          Tekrar yanıtı ilk yanıtın birebir kopyası DEĞİLDİR: yalnız kalıcı
          alanlar (kimlik, durum, sayfalar, imza bağlantıları) döner;
          `dispatch`, `variables_applied`, `field_layout` gibi o isteğin çalışma
          zamanı çıktıları YOKTUR. Anahtara kişisel veri yazmayın (alan düz metin
          saklanır).

          Multipart uçlarda başlık yerine gövdedeki `idempotency_key` alanı da
          kullanılabilir; ikisi birden gönderilip ÇELİŞİRSE
          `400 INVALID_IDEMPOTENCY_KEY`.

          Biçim: 1-255 karakter, boşluksuz yazdırılabilir ASCII.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/_api_v1_demands_upload_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands_upload_post_201_response"
          description: Sözleşme oluşturuldu
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates__id__get_404_response"
          description: |
            Geçersiz istek. Örnek hatalar:
            - "template_id gerekli"
            - "party_mapping gerekli (en az 1 taraf)"
            - "party_mapping[0].first_name ve last_name gerekli"
            - "party_mapping[0].email veya phone gerekli"
            - "party_mapping[0].variables object olmalı"
            - "party_mapping[0].variables.adres value'su string|number|boolean|null olmali"
            - "variables object olmalı"
            - "template_party_id duplicate'i bulundu: <id>"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates_get_401_response"
          description: API key geçersiz veya eksik
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands_upload_post_402_response"
          description: |
            Yetersiz kredi: `INSUFFICIENT_CREDITS` veya `MEMBER_LIMIT_EXCEEDED`.
            Sözleşme bu noktada ZATEN oluşturulmuştur ve davet gitmemiştir:
            gövdedeki `demand_id` ile aynı sözleşmeyi kredi yükledikten sonra
            `POST /demands/{id}/dispatch` ile gönderebilirsiniz; sözleşme
            silinmez.
        "403":
          description: |
            Organizasyona bağlı API anahtarı ile uyuşmayan `X-Workspace-Id`
            (`WORKSPACE_MISMATCH`). Yalnız `field_template_id` yolunda.
        "404":
          description: Alan Şablonu bulunamadı (`TEMPLATE_NOT_FOUND`)
        "409":
          description: |
            Üç ayrı kod döner.

            `IDEMPOTENCY_KEY_REUSED` — aynı `Idempotency-Key` daha önce FARKLI
            bir içerikle kullanıldı. Sessizce eski sözleşmeyi döndürmek
            "gönderdim sandım" kazası üretirdi; yeni sözleşme için yeni anahtar
            gönderin. Gövdede eski sözleşmenin `demand_id` alanı döner.

            `IDEMPOTENCY_UNVERIFIABLE`: bu `Idempotency-Key` daha önce bir
            sözleşme üretti, ancak bu isteğin aynı içerikte olduğu
            doğrulanamadı. Eski sözleşme sessizce döndürülmez. Gövdedeki
            `demand_id` ile durumu sorgulayın; yeni bir anahtarla körlemesine
            tekrar denemek ikinci bir sözleşme oluşturur.

            `DUPLICATE_SUSPECTED` — idempotency anahtarı GÖNDERİLMEDİ ve aynı
            API anahtarı son 10 dakika içinde aynı içeriği (aynı belge/şablon +
            aynı taraf kümesi) zaten gönderdi. Gövdede mevcut sözleşmenin
            `demand_id` alanı döner. Kasten tekrarlamak için `force` gönderin.

            Bu kapı yalnız anahtarsız çağrılarda çalışır: `Idempotency-Key`
            gönderen istemci zaten tekrar-korumalıdır.
        "413":
          description: Dosya boyut limiti aşıldı (FILE_TOO_LARGE)
        "415":
          description: |
            `field_template_id` yolunda PDF olmayan dosya
            (`UNSUPPORTED_FILE_TYPE`).
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldLayoutUnresolved"
          description: |
            Görsel okunamadı (`IMAGE_DECODE_FAILED`) **veya** alan yerleşimi
            bu belgeye uygulanamadı (`FIELD_LAYOUT_UNRESOLVED`). İkinci
            durumda sözleşme oluşturulmaz ve kredi düşülmez.
        "429":
          description: |
            `TOO_MANY_REQUESTS` — API anahtarı başına dakikada 30 istek sınırı
            aşıldı. Bu uç yükleme + PDF ayrıştırma yapar ve `send_invitations`
            ile gerçek SMS/e-posta tetikleyebilir; sınır kötüye kullanımın
            hızını kırmak içindir.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands_upload_post_500_response"
          description: |
            `RECONCILE_FAILED`: kredi mutabakatı beklenmedik (kredi-dışı) bir
            hatayla düştü. Sözleşme bu noktada ZATEN oluşturulmuştur ve davet
            gitmemiştir; gövdedeki `demand_id` ile durumu sorgulayın. İstek
            güvenle tekrarlanabilir (mutabakat idempotenttir).
      summary: Dosya upload ile sözleşme oluştur (şablonsuz)
      tags:
      - Demands
      x-required-scope: demands:write
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /api/v1/field-templates:
    get:
      description: |
        Hesabınızdaki (ya da seçili çalışma alanındaki) **Alan Şablonlarını**
        (`kind: FIELD_LAYOUT`) döner.

        ### Neden ayrı bir uç

        `GET /api/v1/templates` Alan Şablonlarını bilerek listelemez ve
        `GET /api/v1/templates/{id}` onlara `404` döner. Alan Şablonunun
        referans belgesi hiçbir imzacıya gönderilmez; belgeli şablon
        sanılması, o referans belgenin karşı tarafa gitmesi demek olurdu.
        Bu yüzden varsayılan davranış hariç tutmaktır ve Alan Şablonlarını
        görmek açık bir talep gerektirir.

        Döndürülen `id`, `POST /api/v1/demands/upload` çağrısındaki
        `field_template_id` ve `POST /api/v1/field-templates/{id}/preview-layout`
        için kullanılır.

        `parties` dizisi taraf sırasına göre döner; upload gövdesindeki
