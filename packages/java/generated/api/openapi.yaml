    CreatedDemandUpload_dispatch:
      description: |
        YALNIZ istekte `send_invitations` gönderildiğinde döner. Davet
        gönderimi 201'i düşürmez (sözleşme yaratılmış ve kredi düşülmüştür),
        bu yüzden hatalar burada taraf bazında raporlanır.
      example:
        requested: true
        sent: 0
        results:
        - party_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          sms: true
          email: true
          whatsapp: true
          error: DISPATCH_FAILED
        - party_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          sms: true
          email: true
          whatsapp: true
          error: DISPATCH_FAILED
        error: DISPATCH_SKIPPED
      properties:
        requested:
          example: true
          type: boolean
        sent:
          description: |
            En az bir kanaldan (SMS/e-posta/WhatsApp) davet **gönderilen
            taraf** sayısı — kanal sayısı DEĞİL. (`POST /api/v1/demands`
            yanıtındaki `dispatched` alanı kanal sayar; bu alan saymaz.)
          type: integer
        results:
          items:
            $ref: "#/components/schemas/CreatedDemandUpload_dispatch_results_inner"
          type: array
        error:
          description: |
            `DISPATCH_SKIPPED` — sözleşme satırı okunamadı, bildirim
            ayarları bilinmediği için hiç davet gönderilmedi.
            `DISPATCH_TOO_MANY` — taraf sayısı 20 sınırını aşıyor.
          enum:
          - DISPATCH_SKIPPED
          - DISPATCH_TOO_MANY
          type: string
      type: object
    CreatedDemandUpload_field_layout:
      description: |
        YALNIZ `field_template_id` gönderildiğinde döner. Alan yerleşiminin
        uygulanma özeti.
      example:
        template_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        applied_fields: 6
