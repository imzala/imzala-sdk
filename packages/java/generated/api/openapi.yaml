    EnvelopeDocument:
      description: |
        Çok-belgeli imza zarfındaki tek bir belge. `assigned_party_ids` ve
        `decision_count` yalnız `GET .../documents?view=wizard` yanıtında
        bulunur; `has_timestamp` yalnız varsayılan (özet) görünümde bulunur —
        ikisi AYNI ANDA gelmez (dashboard'un iki ayrı iç DTO'sunun
        [`EnvelopeDocumentDTO` / `EnvelopeDocumentSummaryDTO`] tek şema
        altında birleştirilmiş hâli).
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        order: 0
        title: title
        doc_kind: CONTRACT
        is_required: true
        signature_required: true
        assigned_party_ids:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        decision_count: 6
        sealing_status: NONE
        has_timestamp: true
        page_count: 1
        completed_at: 2000-01-23T04:56:07.000+00:00
        progress: ""
        sealing: ""
        decisions:
        - party_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          decision: PENDING
          decided_at: 2000-01-23T04:56:07.000+00:00
          withdrawn_at: 2000-01-23T04:56:07.000+00:00
          signature_collected: true
          recorded: true
          consent_granted: true
        - party_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          decision: PENDING
          decided_at: 2000-01-23T04:56:07.000+00:00
          withdrawn_at: 2000-01-23T04:56:07.000+00:00
          signature_collected: true
          recorded: true
          consent_granted: true
      properties:
        id:
          format: uuid
          type: string
        order:
          description: 1'den başlar.
          type: integer
        title:
          type: string
        doc_kind:
          enum:
          - CONTRACT
          - KVKK_NOTICE
          - KVKK_CONSENT
          - PREINFO
          - PRICE_LIST
          - OTHER
          type: string
        is_required:
          type: boolean
        signature_required:
          type: boolean
        assigned_party_ids:
          description: Yalnız `?view=wizard` yanıtında bulunur.
          items:
            format: uuid
            type: string
          type: array
        decision_count:
          description: |
            Yalnız `?view=wizard` yanıtında bulunur. Bu belge için verilmiş
            onay/red kararı sayısı.
          type: integer
        sealing_status:
          enum:
          - NONE
          - PENDING
          - SEALED
          - FAILED
          nullable: true
          type: string
        has_timestamp:
          description: |
            Yalnız varsayılan (özet) görünümde bulunur. `sealing_status`
            `SEALED` değilken daima `false` döner.
          type: boolean
        page_count:
          type: integer
        completed_at:
          format: date-time
          nullable: true
          type: string
        progress:
          allOf:
          - $ref: "#/components/schemas/DocumentProgress"
          description: Yalnız `GET .../documents` liste yanıtında bulunur.
        sealing:
          allOf:
          - $ref: "#/components/schemas/DocumentSealing"
          description: Yalnız `GET .../documents` liste yanıtında bulunur.
        decisions:
          description: |
            Yalnız `GET .../documents` liste yanıtında bulunur. Belge başına
            taraf kararları; `GET /api/v1/demands/{id}` yanıtındaki
            `documents[].decisions` ile aynıdır.
          items:
            $ref: "#/components/schemas/DocumentPartyDecision"
          type: array
      type: object
