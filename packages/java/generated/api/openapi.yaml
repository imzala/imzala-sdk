      x-accepts:
      - application/json
    get:
      description: |
        Kurum çalışma alanında erişim, sözleşme listesi ile aynı rol kuralını
        izler: OWNER ve ADMIN kurumun tüm sözleşmelerini, MEMBER yalnız kendi
        oluşturduğu sözleşmeleri görür. Erişim yoksa 404 döner.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands__id__get_200_response"
          description: Başarılı
        "404":
          content:
            application/json:
              schema:
