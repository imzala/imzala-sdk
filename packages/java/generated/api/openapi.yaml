                  document_variables:
                    <bakim-eki-belge-id>:
                      baslangic_tarihi: 2026-11-01
            schema:
              $ref: "#/components/schemas/CreateDemandRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands_post_201_response"
          description: Sözleşme oluşturuldu
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands_post_400_response"
          description: |
            Geçersiz istek. Örnek hatalar:
            - "template_id gerekli"
            - "party_mapping gerekli (en az 1 taraf)"
            - "party_mapping[0].first_name ve last_name gerekli"
            - "party_mapping[0].email veya phone gerekli"
            - "party_mapping[0].variables object olmalı"
            - "party_mapping[0].variables.adres value'su string|number|boolean|null olmali"
            - "variables object olmalı"
            - "template_party_id duplicate'i bulundu: <id>"

            `INVALID_EXPIRY_DATE`: `expiry_date` çözümlenemiyor veya takvimde
            olmayan bir gün (ör. `2026-02-30`). Bu hatada `error` insan-okur
            mesajı, `code` alanı makinece okunur kodu taşır.

            `INVALID_LOCALE`: `party_mapping[i].locale` `tr`, `en` veya `null`
            değil. `error` hatalı alanın yolunu taşır; sözleşme oluşturulmaz,
            kredi düşülmez.

            `INVALID_DOCUMENT_SELECTION`: belge seçimi hatası; `details.reason`
            şu değerlerden biridir: `shape` (biçim: nesne değil, bilinmeyen
            alan, kimlik metin değil, 20'den fazla kimlik), `unknown_document`
            (kimlik bu şablonun belgesi değil), `conflict` (aynı kimlik iki
            listede), `empty` (seçim sonucunda belge kalmadı). Biçim hataları
            kredi kontrolünden önce, şablona bağlı hatalar şablon erişim
            kontrolünden sonra ve kredi kontrolünden önce döner.

            `INVALID_DOCUMENT_VARIABLES`: `document_variables` hatası;
            `details.reason` şu değerlerden biridir: `shape` (biçim: nesne
            değil, değer string|number|boolean|null değil, boş ya da ayrılmış
            anahtar, 20'den fazla belge), `unknown_document` (kimlik bu
            şablonun belgesi değil), `unselected_document` (belge bu istekte
            gönderilmiyor; `documents.include` ile ekleyin). `details.path`
            hatalı alanı (`document_variables` ya da
            `party_mapping[i].document_variables`), `details.document_ids`
            yalnız gönderdiğiniz kimlikleri taşır. Biçim hataları kredi
            kontrolünden önce, şablona bağlı hatalar şablon erişim
            kontrolünden sonra döner; hiçbirinde sözleşme oluşturulmaz.

            `SIGNATURE_VARIANTS_PHONE_ONLY`: `allowed_signature_variants`
            yalnız `phone` içeriyor. Telefonda çizim tek başına seçilemez;
            listede en az bir `phone` olmayan yöntem bırakın.

            `SIGNATURE_VARIANTS_PHONE_DRAW_EXCLUSIVE`:
            `allowed_signature_variants` içinde `phone_draw` başka bir
            yöntemle birlikte gönderildi. `phone_draw` yalnız tek başına
            kullanılabilir (`["phone_draw"]`).

            `TERM_INVALID`: sözleşme süre/yenileme (`ContractTermInput`)
            alanlarında geçersiz veya çelişkili bir kombinasyon (ör.
            `term_fixed_end_date` ile `term_duration_months` birlikte, veya
            `renewal_type: AUTO_RENEW` periyotsuz). `field` hangi anahtarın
            reddedildiğini gösterir.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates_get_401_response"
          description: API key geçersiz veya eksik
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands_post_402_response"
          description: |
            Kredi mutabakatı başarısız: `INSUFFICIENT_CREDITS` (bakiye
            yetersiz) veya `MEMBER_LIMIT_EXCEEDED` (organizasyon üyesinin
            aylık kredi limiti aşıldı, havuzda bakiye olsa bile).

            Sözleşme bu noktada ZATEN oluşturulmuştur ve davet gitmemiştir:
            gövdede `data.id` ile aynı sözleşmenin kimliği ve
            `data.status: "DRAFT_UNDISPATCHED"` döner. Kredi yükleyip aynı
            sözleşmeyi `POST /demands/{id}/dispatch` ile gönderin; sözleşme
            silinmez.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates_get_401_response"
          description: |
            **SMS_CUSTOMIZATION_NOT_ALLOWED** — Body'de `sms_content` alanı dolu
            gönderildi ama çağıran organizasyon PRO/ENTERPRISE planda değil veya
            kendi SMS sağlayıcı config'i (sender_name dolu) yok. `sms_content`
            alanını çıkarın veya planınızı yükseltip kendi SMS sağlayıcınızı tanımlayın.
        "409":
          description: |
            Altı ayrı kod döner.

            `IDEMPOTENCY_KEY_REUSED` — aynı `Idempotency-Key` daha önce FARKLI
            bir içerikle kullanıldı. Sessizce eski sözleşmeyi döndürmek
            "gönderdim sandım" kazası üretirdi; yeni sözleşme için yeni anahtar
            gönderin. Gövdede eski sözleşmenin `demand_id` alanı döner.

            `IDEMPOTENCY_UNVERIFIABLE`: bu `Idempotency-Key` daha önce bir
            sözleşme üretti, ancak bu isteğin aynı içerikte olduğu
            doğrulanamadı. Eski sözleşme sessizce döndürülmez. Gövdedeki
            `demand_id` ile durumu sorgulayın; yeni bir anahtarla körlemesine
            tekrar denemek ikinci bir sözleşme oluşturur.

            `DUPLICATE_SUSPECTED` — idempotency anahtarı GÖNDERİLMEDİ ve aynı
            API anahtarı son 10 dakika içinde aynı içeriği (aynı belge/şablon +
            aynı taraf kümesi) zaten gönderdi. Gövdede mevcut sözleşmenin
            `demand_id` alanı döner. Kasten tekrarlamak için `force` gönderin.

            Bu kapı yalnız anahtarsız çağrılarda çalışır: `Idempotency-Key`
            gönderen istemci zaten tekrar-korumalıdır.

            `PARTY_WITHOUT_DOCUMENTS`: eşlediğiniz bir tarafa imzalayacak
            belge düşmüyor. Üç biçimde görünebilir: (a) şablon düzeyinde
            ön-kontrol (rol hiçbir şablon belgesine atanmamış ve davet
            gönderilecek) sözleşmeyi HİÇ yaratmadan reddeder, gövdede
            `template_party_ids` (şablon rol kimlikleri) döner; (b)
            `documents` seçiminiz (ya da `documents` göndermediyseniz
            şablonun varsayılan belge kümesi) bir role seçili belge
            bırakmıyorsa `dispatch_notifications` değerinden bağımsız yine
            yaratmadan reddedilir, gövdede `template_party_ids` döner
            (seçimi değiştirin ya da o rolü eşlemeden çıkarın); (c) oluşturma
            sonrası aynı kontrol atamasız tarafı bulursa sözleşme TASLAĞA
            düşürülür ve gövdede
            `party_ids` (imzacı kimlikleri) + `data.id` / `data.status:
            "DRAFT_UNDISPATCHED"` döner. Hiçbir biçimde kredi düşülmez, davet
            gönderilmez.

            `TEMPLATE_DOCUMENTS_NOT_READY`: şablonun belge yapısı henüz hazır
            değil; `documents` ve `document_variables` göndermeden deneyin ya
            da destekle iletişime geçin.

            `DOCUMENT_SOURCE_UNAVAILABLE`: şablonun ilk belgesini çıkardınız
            ve kalan ilk belgenin kaynak dosyası yok; ilk belgeyi de gönderin
            ya da o belgeye dosya yükleyin.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands_post_500_response"
          description: |
            `RECONCILE_FAILED`: kredi mutabakatı beklenmedik (kredi-dışı) bir
            hatayla düştü. Sözleşme bu noktada ZATEN oluşturulmuştur ve
            TASLAĞA düşürülür; gövdede `data.id` / `data.status:
            "DRAFT_UNDISPATCHED"` döner. Davet gönderilmez. İstek güvenle
            tekrarlanabilir (mutabakat idempotenttir).
      summary: Sözleşme oluştur (şablondan)
      tags:
      - Demands
      x-required-scope: demands:write
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/demands/bulk:
    post:
      description: |
        Tek şablondan en fazla 10 alıcıya AYRI AYRI sözleşme oluşturur ve
        her birine imza daveti gönderir (DocuSign "bulk send" modeli). Her
        satır bağımsız bir sözleşmedir; satır-başı kısmi başarı raporlanır.

        **Davranış:**
        - `rows` en fazla 10 (aşarsa 400 `BULK_MAX_10`). Daha büyük listeler
          istemci tarafında 10'arlı parçalara bölünür.
        - Kredi: sabit "1 satır = 1 kredi" değildir, her satırın maliyeti
          `POST /demands` ile AYNI formülle hesaplanır (imza sınıfı taban
          ücreti + doğrulama yöntemi ek maliyetleri + PAdES seviye ek
          maliyeti, imzacı sayısıyla çarpılır; `eidas_timestamp` seçilirse
          satır başına +1 kredi eklenir). Şablon çok-belgeli bir zarf
          tanımlıyorsa imzacı başına maliyet o imzacıya ATANMIŞ belge
          sayısına göre hesaplanır ve belge sayısına göre azalan birim
          fiyatlı bir indirim uygulanır (1 belge %0, 2 belge %30, 3 ve üzeri
          %50, imzacı başına ayrı yukarı yuvarlanır; bkz. `POST /demands`
          "Kredi (çok belgeli zarf)" bölümü). PAdES seviye eki yalnız QES'te
          uygulanır: B-T +0, B-LT +0, **B-LTA +1**. Doğrulama yöntemlerinden
          `ocr_id` ve `liveness` +1 kredi, diğerleri 0'dır. `options`
          batch-seviye geçerlidir ve şablon varsayılanını ezer. İstek başında N satırın
          toplam maliyeti için yeterlilik kontrol edilir (yetersizse 402,
          hiçbir sözleşme yaratılmaz); ayrıca her satır kendi maliyeti için
          tekrar kontrol edilir; kredi satır oluşturma sırasında
          tükenirse o satır `failed` (`error: "INSUFFICIENT_CREDITS"`)
          olarak işaretlenir, batch devam eder. Nadir bir yarışta (satır
          oluşturulduktan hemen sonra kredi mutabakatı reddederse) o satır
          yine `failed` döner ama sözleşme zaten oluşturulmuş taslak
          olarak kalır (`demand_id` response'ta bulunur, davet
          gönderilmemiştir); mutabakat kredi-dışı bir hatayla düşerse satır
          `failed` (`error: "RECONCILE_FAILED"`) döner, sözleşme yine taslağa
          düşer.
        - Atamasız imzacı: çok belgeli şablonda eşlenen bir taraf hiçbir
          belgeye atanmamışsa (ve `options.dispatch_notifications` `false`
          DEĞİLSE) o satır `failed` (`error: "PARTY_WITHOUT_DOCUMENTS"`)
          döner; kontrol satır oluşturulmadan ÖNCE (`demand_id` YOK) veya
          oluşturulduktan hemen SONRA (sözleşme taslağa düşer, `demand_id` +
          `party_ids` döner) çalışabilir. Diğer satırlar etkilenmez.
        - Belge seçimi satır başınadır: `rows[i].documents` (`POST /demands`
          ile aynı şema). `options.documents` gönderilirse 400
          `INVALID_DOCUMENT_SELECTION`. Satırın seçim hatası o satırı `failed`
          yapar (`error`: `INVALID_DOCUMENT_SELECTION` + `details`, ya da
          `PARTY_WITHOUT_DOCUMENTS` + `template_party_ids`); diğer satırlar
          etkilenmez.
        - Belge başına değişkenler (`document_variables`) bu uçta
          desteklenmez; yalnız `POST /demands` ile gönderilir. Satırda (kökte
          ya da `party_mapping[i]` içinde) gönderilirse o satır `failed`
          (`error: "INVALID_DOCUMENT_VARIABLES"`, `details.reason:
          "unsupported_endpoint"`, `details.path`) döner ve oluşturulmaz;
          `options.document_variables` gönderilirse 400
          `INVALID_DOCUMENT_VARIABLES` döner, hiçbir satır oluşturulmaz.
        - Şablon sahipliği istek başında bir kez doğrulanır (workspace-scoped;
          başka workspace'in şablonu 404).
        - Kısmi başarı normaldir: batch tamamlanınca HTTP 200 döner (bazı
          satırlar `failed` olsa bile). Yalnızca ön-kontrol redleri
          (cap/kredi/sahiplik) 400/402/404 döner.
        - `X-Workspace-Id` header'ı ile organizasyon workspace'i seçilebilir.

        Rate limit: 5 istek/dakika (API key başına).
      parameters:
      - description: |
          Organizasyon (workspace) kimliği.

          - **Organizasyon anahtarı:** zorunlu değildir; gönderilmezse anahtarın
            bağlı olduğu organizasyon otomatik uygulanır. Anahtarın
            organizasyonundan farklı bir kimlik gönderilirse 403
            `WORKSPACE_MISMATCH` döner.
          - **Kişisel anahtar:** gerekmez. Üyesi olmadığınız bir organizasyon
            kimliği gönderilirse 403 döner
            (`Not a member of this organization`).
        explode: false
        in: header
        name: X-Workspace-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_demands_bulk_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands_bulk_post_200_response"
          description: |
            Batch tamamlandı (kısmi başarı dahil). `results` giriş sırasında,
            her satır `row_index` ile eşlenir.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            Geçersiz istek. Olası kodlar: `BULK_MAX_10` (`rows` 10'dan fazla),
            boş `rows`, eksik `template_id`, `INVALID_DOCUMENT_SELECTION`
            (`options.documents` gönderildi; belge seçimi satır başınadır,
            bkz. `rows[i].documents`), `INVALID_DOCUMENT_VARIABLES`
            (`options.document_variables` gönderildi; bu uçta desteklenmez,
            `details.reason: "unsupported_endpoint"`), `INVALID_PADES_LEVEL`
            (`options.qes_pades_level` satılabilir seviyelerden biri değil),
            `FIELD_LAYOUT_TEMPLATE_NOT_SENDABLE` (verilen kimlik bir Alan
            Şablonuna ait). AB nitelikli zaman damgası hesabınızda kapalıyken
            `eidas_timestamp` gönderilirse de 400 döner.

            `SIGNATURE_VARIANTS_PHONE_ONLY`:
            `options.allowed_signature_variants` yalnız `phone` içeriyor.
            `SIGNATURE_VARIANTS_PHONE_DRAW_EXCLUSIVE`: `phone_draw` başka bir
            yöntemle birlikte gönderildi. Batch-seviye kontrol olduğu için
            hiçbir satır oluşturulmaz.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates_get_401_response"
          description: API key geçersiz veya eksik
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            INSUFFICIENT_CREDITS: N satırın toplam tahmini maliyeti için
            yeterli kredi yok (ön kontrol; hiçbir sözleşme yaratılmadı).
            Satır bazlı yetersiz kredi durumları burada DEĞİL, 200 yanıtı
            içindeki `results[].status: "failed"` altında döner.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: INSUFFICIENT_SCOPE (demands:write yok) veya SMS_CUSTOMIZATION_NOT_ALLOWED
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates__id__get_404_response"
          description: Kayıt bulunamadı
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: |
            `QES_NOT_SUPPORTED_MULTI_DOCUMENT`: güvenli elektronik imza birden
            çok belge içeren zarflarda henüz desteklenmiyor.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: İstek limiti aşıldı (API anahtarı başına 5 toplu istek/dakika)
      summary: Toplu sözleşme oluştur (tek şablondan N alıcı)
