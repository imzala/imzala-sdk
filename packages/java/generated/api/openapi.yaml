  /api/v1/demands/{id}:
    delete:
      description: |
        Tamamlanmamış sözleşmeyi ve ilişkili tüm verilerini siler. 🔴
        Tamamlanmış (COMPLETED) sözleşme API'den SİLİNEMEZ (imzalı belge +
        denetim izi kaybı geri alınamaz) → 409 `DEMAND_COMPLETED`.
        Arşivlenmiş sözleşme de silinemez → 409 `DEMAND_ARCHIVED`; önce
        `POST /api/v1/demands/{id}/unarchive` ile arşivden çıkarın.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates__id__delete_200_response"
          description: Silindi
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates__id__get_404_response"
          description: Kayıt bulunamadı
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands__id__delete_409_response"
          description: Tamamlanmış (`DEMAND_COMPLETED`) veya arşivlenmiş (`DEMAND_ARCHIVED`)
            sözleşme silinemez
      summary: Sözleşme sil (yalnızca tamamlanmamış)
      tags:
      - Demands
