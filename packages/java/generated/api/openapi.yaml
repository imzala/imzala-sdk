    _api_v1_demands_upload_post_request:
      properties:
        files:
          description: 1 belge VEYA 1-20 görsel
          items:
            format: binary
            type: string
          type: array
        order:
          description: "Çoklu görsel sırası (JSON array of indices, örnek \"[0,2,1]\"\
            )"
          type: string
        title:
          description: |
            Sözleşme başlığı (boşsa varsayılan bir başlık
            kullanılır). Başlık, imza davet ve hatırlatma
            SMS'lerinde imzacının telefon ekranında görünebilir;
            kişisel veya gizli bilgi yazmayın.
          type: string
        description:
          type: string
        parties:
          description: |
            JSON array of party objects.
            Her party: first_name, last_name (zorunlu), email VEYA phone (zorunlu).

            `field_template_id` gönderildiğinde her party AYRICA
            `template_party_id` (Alan Şablonu rolü) taşımak zorundadır
            ve şablondaki her rol tam olarak bir kez eşlenmelidir.

            Opsiyonel `locale` (`tr`, `en` veya `null`): imzacının
            dijital imza sayfasını ve bildirimlerini göreceği dil (bkz.
            `PartyMappingInput.locale`). Alan Şablonu kullanılırken
            gönderilmezse rolün varsayılan dili uygulanır. Geçersiz
            değer `400 INVALID_LOCALE` döner, sözleşme oluşturulmaz.
          example: "[{\"first_name\":\"Ayşe\",\"last_name\":\"Yılmaz\",\"email\":\"\
            ayse@example.com\"}]"
          type: string
        field_template_id:
          description: |
            Alan Şablonu (`kind: FIELD_LAYOUT`) kimliği. Verilirse
            yüklenen belgeye şablonun alan yerleşimi uygulanır.

            - Yüklenen dosya **PDF olmak zorundadır** (sihirli bayt
              doğrulaması; DOCX/ODT/RTF bu yolda kabul edilmez) ve tek
              dosya olmalıdır.
            - `template_id` ile **birlikte gönderilemez**
              (400 `FIELD_TEMPLATE_CONFLICT`).
            - Çözümleme sözleşme yaratımından ve kredi düşümünden
              ÖNCE koşar: 422 dönen bir istek sözleşme yaratmaz, kredi
              düşmez.
            - Ön kontrol için `POST /api/v1/field-templates/{id}/preview-layout`.
          format: uuid
          type: string
        force:
          description: |
            Kopya kapısını bilerek geç. Yalnız `Idempotency-Key`
            GÖNDERİLMEYEN çağrılarda anlamlıdır; aynı belgeyi aynı
            taraflara kasten ikinci kez göndermek için.
          enum:
          - "true"
          - "1"
          type: string
        send_invitations:
          description: |
            `"true"` (veya `"1"`) verilirse imza davetleri **aynı
            istekte** gönderilir; taraf başına ayrıca
            `POST /api/v1/demands/{id}/parties/{partyId}/resend`
            çağırmanız gerekmez.

            - **Varsayılan kapalıdır.** Bu uç tarihsel olarak davet
              göndermiyordu; mevcut entegrasyonların davranışı
              değişmemelidir. Tanınmayan değer 400 `INVALID_SEND_INVITATIONS`
              döner (fail-closed).
            - **Açık değerler:** `"true"`, `"1"`, `"all"`, `"email"`, `"sms"`.
            - **Kapalı değerler:** `"false"`, `"0"`, `"off"`, `"no"`,
              `"hayir"`, `"hayır"`.
            - Ad bilerek `dispatch_notifications` **değildir**: o
              parametre `POST /api/v1/demands` ve `/demands/bulk`
              uçlarında vardır ve orada varsayılanı **açıktır**.
              Karıştırılırsa sessizce ters anlam üretir.
            - Kanal: `"true"`, `"1"` ve `"all"` tüm kanalları kullanır;
              `"email"` yalnız e-posta, `"sms"` telefon kanalları (SMS
              ve WhatsApp) gönderir. Değer yalnız **daraltır**:
              sözleşmenin bildirim ayarlarında veya tarafın
              `send_sms`/`send_email` bayraklarında kapalı olan bir
              kanalı açamaz. Bu uçtan yaratılan sözleşmelerde bu
              ayarlar açık doğar.
            - En çok **20 tarafa** davet gönderilir; üstünde sözleşme
              yine oluşur ama davet gönderilmez
              (`dispatch.error = DISPATCH_TOO_MANY`), tarafları
              `resend` ile çağırın.
            - 🔴 **Tekrar denemeye dikkat:** isteği `Idempotency-Key`
              olmadan zaman aşımında körlemesine tekrarlarsanız **yeni
              bir sözleşme, yeni kredi ve ikinci bir davet seti**
              oluşabilir (kopya kapısı `DUPLICATE_SUSPECTED` yalnız aynı
              içerikte ve 10 dakika içinde devreye girer). Tekrar
              edebileceğiniz her istekte `Idempotency-Key` gönderin;
              anahtar yoksa yeniden göndermek yerine
              `GET /api/v1/demands?...` ile sonucu doğrulayın.
          enum:
          - "true"
          - "1"
          - all
          - email
          - sms
          - "false"
          - "0"
          - "off"
          - "no"
          - hayir
          - hayır
          type: string
        on_anchor_miss:
          description: |
            Çapa bulunamadığında ne yapılacağı. Yalnız
            `field_template_id` ile anlamlıdır.

            Bu parametre şablon ayarını yalnızca **sıkılaştırabilir**:
            - Gönderilmezse şablon ayarı geçerli değildir, `block` uygulanır.
            - `drop`, yalnız şablonun İLGİLİ TÜM alanları zaten `DROP`
              ise uygulanır; aksi halde yok sayılır, `block` uygulanır
              ve yanıtta `ON_ANCHOR_MISS_NOT_RELAXED` uyarısı döner.
            - İmza alanlarında `drop` hiçbir koşulda uygulanmaz.
            - `fallback` bu API'de **yoktur** (400 `INVALID_ON_ANCHOR_MISS`).

            Yanıttaki `data.field_layout.on_anchor_miss` istenen değil,
            **uygulanan** değeri taşır.
          enum:
          - block
          - drop
          type: string
      required:
      - files
      - parties
      type: object
