    post:
      description: |
        Belirtilen şablondan yeni bir sözleşme oluşturur, taraf bilgilerini
        kaydeder, dynamic field'ları `variables` payload'undan doldurur ve
        imzalama URL'lerini döner.

        **Variable resolution:**
        - Item'ın `template_party_id` non-null → `party_mapping[i].variables`'ta
          o slug var ise oradan uygulanır
        - Yoksa root `variables`'tan fallback
        - Hiçbiri yoksa item boş kalır (signer manuel doldurabilir,
          `editable: true` ise)

        **Validation:**
        - `party_mapping[i].variables` ve root `variables` object olmalı
        - Variable value'ları `string | number | boolean | null` olmalı
          (object/array reject)
        - `template_party_id` party_mapping içinde unique olmalı

        **Kredi (çok belgeli zarf):** Şablon çok-belgeli bir zarf tanımlıyorsa
        (her belge farklı imzacı(lar)a atanabilir), imzacı başına kredi o
        imzacıya ATANMIŞ belge sayısına göre hesaplanır ve belge sayısına göre
        azalan birim fiyatlı bir indirim uygulanır: 1 belge %0, 2 belge %30,
        3 ve üzeri %50 (indirim imzacı başına ayrı hesaplanır ve yukarı
        yuvarlanır). AB nitelikli zaman damgası (`eidas_timestamp`) seçiliyse
        aynı indirim zarftaki farklı belge sayısına göre toplam üzerinden
        uygulanır. Tek belgeli şablonlarda tutar eski formülle bayt-aynıdır.

        **Atamasız imzacı:** `dispatch_notifications` `false` gönderilmediği
        sürece, eşlenen bir taraf şablonun hiçbir belgesine atanmamışsa
        sözleşme HİÇ oluşturulmaz (409 `PARTY_WITHOUT_DOCUMENTS`). Bu kontrolü
        atlamak için `dispatch_notifications: false` gönderip belge
        atamalarını `PUT .../documents/{docId}/assignments` ile düzelttikten
        sonra `POST .../dispatch` ile gönderin (o uç aynı kapıyı yeniden
        uygular).
      parameters:
      - description: |
          Çağıranın kendi referansı (sipariş / dosya numarası olabilir). Aynı API
          anahtarı + aynı anahtarla gelen İKİNCİ istek yeni sözleşme YARATMAZ:
          ilk sözleşme `reused: true` + `created_at` ile döner, kredi düşülmez,
          davet gönderilmez.

          🔴 Anahtar KALICIDIR (süre sınırı yoktur). Numaralandırmanızı yıl
          döngüsünde tekrar kullanıyorsanız yıl/ön ek ekleyin. Aynı anahtar
          FARKLI içerikle gelirse `409 IDEMPOTENCY_KEY_REUSED` döner.

          Tekrar yanıtı ilk yanıtın birebir kopyası DEĞİLDİR: yalnız kalıcı
          alanlar (kimlik, durum, sayfalar, imza bağlantıları) döner;
          `dispatch`, `variables_applied`, `field_layout` gibi o isteğin çalışma
          zamanı çıktıları YOKTUR. Anahtara kişisel veri yazmayın (alan düz metin
          saklanır).

          Multipart uçlarda başlık yerine gövdedeki `idempotency_key` alanı da
          kullanılabilir; ikisi birden gönderilip ÇELİŞİRSE
          `400 INVALID_IDEMPOTENCY_KEY`.

          Biçim: 1-255 karakter, boşluksuz yazdırılabilir ASCII.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              singleParty:
                summary: Tek partili şablon (örn. Vize Danışmanlığı)
                value:
                  template_id: 7ec4b653-e84a-47f1-9e0b-7671e1aae2a1
                  title: Vize Danışmanlığı - Ayşe Yılmaz
                  party_mapping:
                  - template_party_id: e5b4e0cb-c2d5-473f-9f62-44d51c76f56e
                    first_name: Ayşe
                    last_name: Yılmaz
                    email: ayse@example.com
                    phone: "+905551112233"
                    government_id: "36747474747"
                    variables:
                      adres: "Atatürk Cad. No: 12, Çankaya/Ankara"
                      danismanlik_ucreti: 5.000 TL
                      danismanlik_notlar: Schengen vize başvuru danışmanlığı
                      randevu_takibi_ucreti: 1.500 TL
                      randevu_takibi_notlar: Konsolosluk randevu takibi 60 gün
                      genel_toplam: 6.500 TL
              multiParty:
                summary: Multi-party şablon (örn. Kira Sözleşmesi)
                value:
                  template_id: <kira-template-id>
                  title: Kira Sözleşmesi - Mayıs 2026
                  party_mapping:
                  - template_party_id: <kiraya-veren-id>
                    first_name: Ayşe
                    last_name: Yılmaz
                    email: ayse@example.com
                    phone: "+905551112233"
                    government_id: "12345678901"
