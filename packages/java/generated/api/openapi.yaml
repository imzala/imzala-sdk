          type: string
        applied_fields:
          description: Sözleşmeye yazılan alan sayısı.
          type: integer
        on_anchor_miss:
          description: |
            İstenen değil, **uygulanan** davranış. `drop` istenip
            uygulanamadıysa burada `block` görürsünüz ve `warnings`
            içinde `ON_ANCHOR_MISS_NOT_RELAXED` bulunur.
          enum:
