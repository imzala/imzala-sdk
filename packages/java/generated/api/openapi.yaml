        companyName:
          example: Örnek Ltd.
          maxLength: 500
          nullable: true
          type: string
        personalName:
          example: Ayşe Yılmaz
          maxLength: 500
          nullable: true
          type: string
        address:
          maxLength: 500
          nullable: true
          type: string
        companyAddress:
          example: "Kadıköy, İstanbul"
          maxLength: 500
          nullable: true
          type: string
        personalAddress:
          maxLength: 500
          nullable: true
          type: string
        taxNumber:
          example: "1234567890"
          maxLength: 500
          nullable: true
          type: string
        taxOffice:
          example: Kadıköy
          maxLength: 500
          nullable: true
          type: string
        idNumber:
          maxLength: 500
          nullable: true
          type: string
        phone:
          maxLength: 500
          nullable: true
          type: string
        companyPhone:
          example: "+905551112233"
          maxLength: 500
          nullable: true
          type: string
        personalPhone:
          maxLength: 500
          nullable: true
          type: string
        email:
          example: ayse@example.com
          maxLength: 500
          nullable: true
          type: string
      type: object
    PatchStampItemRequest:
