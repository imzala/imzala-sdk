        Belirtilen tarafa imza davetini (SMS/e-posta/WhatsApp, sözleşme
        ayarına göre) tekrar gönderir. İmzalamış/reddetmiş tarafa, onayını
        vermiş onaylayana, açık düzeltme talebi olan tarafa veya sıralı imzada
        sırası gelmemiş tarafa gönderilemez (409). Sıralı imzada onaylayanın onayı o adımı tamamlar;
        sıra bir sonraki tarafa geçer.
      parameters:
      - explode: false
        in: path
        name: id
