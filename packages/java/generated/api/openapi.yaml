          nullable: true
          type: integer
        message:
          type: string
        detail:
          additionalProperties: true
          description: |
            Koda göre değişen, kapalı bir anahtar kümesi (yalnız sayısal
            değerler ve alan kimlikleri).
          nullable: true
          type: object
