      properties:
        template_id:
          description: GET /api/v1/templates listesinden veya dashboard'dan kopyalayın
          format: uuid
          type: string
        title:
          description: |
            Sözleşme başlığı (yoksa template adı kullanılır). Başlık,
            imza davet ve hatırlatma SMS'lerinde imzacının telefon
            ekranında görünebilir; kişisel veya gizli bilgi yazmayın.
          type: string
        description:
          type: string
        idempotency_key:
          description: |
            `Idempotency-Key` başlığının gövde karşılığı; başlık ekleyemeyen
            istemciler için. İkisi birden gönderilip ÇELİŞİRSE
            `400 INVALID_IDEMPOTENCY_KEY`.
          maxLength: 255
          type: string
        force:
          description: |
            Kopya kapısını bilerek geç. Yalnız idempotency anahtarı
            GÖNDERİLMEYEN çağrılarda anlamlıdır: aynı şablondan aynı taraflara
            aynı başlık ve değişkenlerle 10 dakika içinde ikinci bir sözleşmeyi
            kasten göndermek için.
          type: boolean
        party_mapping:
          items:
            $ref: "#/components/schemas/PartyMappingInput"
          minItems: 1
          type: array
        documents:
          $ref: "#/components/schemas/DocumentSelectionInput"
        variables:
          additionalProperties:
            $ref: "#/components/schemas/PartyMappingInput_variables_value"
          description: |
            **Root scope** — partilerden bağımsız field'lara gönderilen değerler.
            Item'ın template_party_id'si NULL ise (partisiz) buradan dolar.
            Multi-party şablonda kira_baslangic_tarihi gibi paylaşılan field'lar.

            **Kaşe alanları:** Değer bir `StampData` NESNESİ ise ve slug bir
            kaşe alanına aitse, sözleşme oluşturulurken o kaşe
            `PATCH /api/v1/demands/{id}/items/{itemId}/stamp` ile aynı kurallarla
            doldurulur (gönderenin kaşesi yapılandırılmış veriyle; imzalayanın
            dolduracağı kaşeye düzenlenebilir ön değer). Aynı slug birden fazla
            belgede geçiyorsa hepsine yazılır; öncelik kuralları `variables` ile
            aynıdır (bkz. `document_variables`). Nesne değer yalnız kaşe
            slug'ına verilebilir: kaşe olmayan ya da gönderilecek belgelerde
            bulunmayan slug 400 `INVALID_VARIABLES`
            (`details.reason: object_value_for_non_stamp`), geçersiz kaşe
            verisi 400 `INVALID_STAMP_DATA` döner; ikisinde de sözleşme
            oluşturulmaz, kredi düşülmez. Kaşe slug'ına düz metin gönderilirse
            kaşeye yazılmaz ve `variables_ignored` içinde görünür. Toplu
            uçlar nesne değeri desteklemez (400 `INVALID_VARIABLES`,
            `details.reason: unsupported_endpoint`).
          example:
            kira_baslangic_tarihi: 2026-10-01
            firma_kasesi:
              companyName: Örnek Ltd.
              taxNumber: "1234567890"
              taxOffice: Kadıköy
              companyAddress: "Kadıköy, İstanbul"
          type: object
        document_variables:
          allOf:
          - $ref: "#/components/schemas/DocumentVariables"
          description: |
            Çok belgeli şablonda BELGE BAŞINA ortak değerler (o belgedeki tüm
            taraflar ve partisiz alanlar için). Opsiyoneldir; göndermezseniz
            `variables` ve `party_mapping[].variables` eskisi gibi çalışır.

            Öncelik (alan bazında; bir seviyede anahtar yoksa bir alttakine
            düşer, açıkça gönderilen boş metin ya da null o seviyede kalır):
            1. `party_mapping[i].document_variables[belge][slug]`
            2. `document_variables[belge][slug]`
            3. `party_mapping[i].variables[slug]`
            4. `variables[slug]`

            Şablona ait olmayan ya da bu istekte gönderilmeyen belge kimliği
            400 `INVALID_DOCUMENT_VARIABLES` ile reddedilir; sözleşme
            oluşturulmaz, kredi düşülmez, davet gönderilmez.
        has_timestamp:
          default: false
          description: TÜBİTAK zaman damgası
          type: boolean
        allowed_signature_variants:
          description: |
            İmzacının kullanabileceği dijital imza yöntemleri ve görünme sırası.
            Dizinin SIRASI imza ekranındaki sekme sırasıdır; listede olmayan
            yöntem o sözleşmede kapalıdır. Değerler: `draw` (parmakla veya fareyle
            çizerek), `type` (adını yazarak), `upload` (imza görselini dosya olarak
            yükleyerek), `phone` (telefonda çizerek).

            Gönderilmezse (veya `null` gönderilirse) şablonun ayarı, şablonda da
            tanımlı değilse organizasyonun ayarı geçerli olur; hiçbiri tanımlı
            değilse dört yöntem varsayılan sırayla açıktır.

            Bu alan toleranslı okunur: boş dizi, dizi olmayan bir değer veya
            tanınmayan bir değer gönderilirse alan YOK SAYILIR ve üst katmandan
            devralınır. Yani boş dizi göndermek "tüm yöntemleri kapat" anlamına
            GELMEZ; en az bir yöntem her zaman açık kalır. Büyük harfli değerler
            (`DRAW`) kabul edilir, tekrar eden değerler teke indirilir.

            Yalnız `phone` içeren bir liste reddedilir (400
            `SIGNATURE_VARIANTS_PHONE_ONLY`): telefonda çizim mobil cihazda
            kullanılamadığı için tek başına bırakılırsa imzacı yöntemsiz kalır.
            En az bir `phone` olmayan yöntem bırakın.

            `phone_draw` ("Yalnız telefonda çizerek") ayrı bir moddur ve YALNIZ
            tek başına gönderilir: `["phone_draw"]`. Bilgisayardan açan imzacı
            yalnız QR kod ile telefona yönlendirilir ve imzasını telefonda
            çizer; telefondan açan imzacı yalnız çizerek imzalar. Başka bir
            yöntemle birlikte gönderilirse 400
            `SIGNATURE_VARIANTS_PHONE_DRAW_EXCLUSIVE` döner.

            Ayar sözleşme düzeyindedir; imzacı bazında farklılaştırılamaz.
            `party_mapping` girdilerine yazılan böyle bir alan yok sayılır.
          example:
          - type
          - draw
          items:
            enum:
            - draw
            - type
            - upload
            - phone
            - phone_draw
            type: string
          maxItems: 4
          nullable: true
          type: array
        dispatch_notifications:
          default: true
          description: |
            `false` verilirse sözleşme yalnız oluşturulur, davet gönderilmez;
            daha sonra `POST /api/v1/demands/{demandId}/dispatch` ile gönderilir
            (çok-belgeli zarf akışında belgeler bu arada eklenir). Varsayılan
            açık: davetler oluşturma anında gider.
          type: boolean
        send_sms_notifications:
          default: true
          type: boolean
        send_email_notifications:
          default: true
          type: boolean
        sms_title:
          default: CODECK
          description: SMS gönderici adı
          type: string
        sms_content:
          description: |
            Custom SMS gövdesi. **Sadece** çağıran organizasyon **PRO veya ENTERPRISE planda**
            ise ve aktif `OrganizationSmsConfig` (sender_name dolu) varsa kabul edilir;
            aksi halde 403 `SMS_CUSTOMIZATION_NOT_ALLOWED` döner.

            FREE/BASIC planda olan veya kendi SMS sağlayıcısı tanımlı olmayan
            müşterilerin marka itibarını korumak için sistem default sağlayıcısı (Codeck NetGSM)
            ile gönderim yapılır ve özel metin reddedilir. Kendi sağlayıcınızı tanımlamak için
            Dashboard → Organizasyon → SMS Ayarları sayfasını kullanın.

            Boş string / null gönderirseniz "clear" olarak yorumlanır (gating'den geçer).
          type: string
        email_content:
          description: Custom e-posta gövdesi
          type: string
        expiry_date:
          format: date-time
          type: string
        require_tc_verification:
          default: false
          type: boolean
        require_biometric_verification:
          default: false
          type: boolean
        reminder_settings:
          allOf:
          - $ref: "#/components/schemas/ReminderSettings"
          description: |
            Bu sözleşme için hatırlatma ayarlarını **şablon default'unu override** ederek
            belirtir. Yollanmazsa şablonun `reminder_*` alanları kullanılır
            (PUT /api/templates/:id ile dashboard'dan kaydedilen değerler);
            şablonda da yoksa `{enabled:true, intervals_hours:[48], max_reminders:1, channels:["email"]}`
            default'u uygulanır. Demand oluşumunda `ReminderConfig` satırı yaratılır
            ve BullMQ kuyruğuna scheduled hatırlatmalar yazılır.
        term_start_mode:
          description: |
            Sözleşme süre/yenileme takibi. Gönderilmezse şablonun takip
            politikası kullanılır. Tam alan kümesi ve doğrulama kuralları
            için `ContractTermInput` şemasına bakın (`PATCH /demands/{id}/term`
            ile AYNI alan adları).
          enum:
          - FIXED_DATE
          - ON_FIRST_SIGNATURE
          - ON_COMPLETION
          nullable: true
          type: string
        term_start_date:
          description: "Yalnız term_start_mode: FIXED_DATE iken kullanılır."
          format: date
          nullable: true
          type: string
        term_duration_months:
          maximum: 600
          minimum: 1
          nullable: true
          type: integer
        term_fixed_end_date:
          format: date
          nullable: true
          type: string
        renewal_type:
          enum:
          - AUTO_RENEW
          - FIXED_TERM
          nullable: true
          type: string
        renewal_period_months:
          description: AUTO_RENEW gerektirir; verilmezse term_duration_months'tan
            devralınır.
          maximum: 600
          minimum: 1
          nullable: true
          type: integer
        notice_days:
          maximum: 3650
          minimum: 0
          nullable: true
          type: integer
        reminder_offsets:
          items:
            maximum: 3650
            minimum: 0
            type: integer
          maxItems: 5
          nullable: true
          type: array
        notify_counterparty:
          type: boolean
      required:
      - party_mapping
      - template_id
      type: object
    ReminderSettings:
      description: |
        Hatırlatma yapılandırması. Şablon (`Template.reminder_*`) ve sözleşme
        (`ReminderConfig`) arasında aynı şemaya sahiptir.
      properties:
        enabled:
          default: true
          description: false → hiç hatırlatma gönderilmez (cron schedule edilmez)
          type: boolean
        intervals_hours:
          default:
          - 48
          description: |
            Sözleşmenin oluşturulduğu andan itibaren saat cinsinden hatırlatma
            aralıkları. Örn. `[24, 72, 168]` → 24 saat sonra, 3 gün sonra ve
            7 gün sonra. `max_reminders` ile limit edilir.
          example:
          - 24
          - 72
          items:
            minimum: 1
            type: integer
          type: array
        max_reminders:
          default: 1
          description: Bir parti için maksimum gönderilecek hatırlatma sayısı
          example: 2
          minimum: 0
          type: integer
        channels:
          default:
          - email
          description: |
            Hatırlatma gönderim kanalı. Birden fazla seçilebilir
            (`["email","sms"]`). SMS kanalı için partinin `phone` alanı dolu ve
            `send_sms: true` olmalı; email kanalı için `email` dolu ve
            `send_email: true` olmalı, ayrıca demand'in `send_sms_notifications`
            / `send_email_notifications` global toggle'ı açık olmalı.
          example:
          - email
          - sms
          items:
            enum:
            - email
            - sms
            type: string
          type: array
      type: object
    TriggerReminderRequest:
      description: Anlık hatırlatma tetikleme isteği gövdesi (tüm alanlar opsiyonel).
      example:
        channels:
        - sms
        force: false
      properties:
        channels:
          default:
          - sms
          - email
          description: |
            Bu çağrıda kullanılacak kanal(lar). Yollanmazsa default `["sms","email"]`
            ile her iki kanalda da gönderilir (parti `send_sms`/`send_email`
            toggle'ı + iletişim alanı + demand global toggle uygunluğuna göre).
          example:
          - sms
          items:
            enum:
            - email
            - sms
            type: string
          type: array
        force:
          default: false
          description: |
            `true` ise 5 dk anti-spam penceresini override eder (son hatırlatma
            5 dk içinde gönderilmiş olsa bile gönderir). Production akışlarında
            yanlışlıkla spam atmamak için sadece kasıtlı admin operasyonlarında
            kullanın.
          type: boolean
      type: object
    CreatedDemand:
