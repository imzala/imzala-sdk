  /api/v1/demands/{demandId}/documents/upload:
    post:
      description: |
        Zarfa **belge başına tek dosya** yükler. Aynı sözleşmeye birden çok
        belge eklemek için bu uç birden çok kez çağrılır — tek istekte N
        belge YASAKTIR.

        `idempotency_key` **zorunludur** (gövde alanı; `Idempotency-Key`
        HEADER'ı ile KARIŞTIRILMAZ, ayrı bir mekanizmadır). Aynı
        `(demandId, idempotency_key)` çifti ile tekrar çağrı **409
        `IDEMPOTENT_REPLAY`** döner ve **yeni belge YARATILMAZ**; yanıt
        gövdesinde daha önce yüklenen belgenin DTO'su döner.

        Belge uçları kredi düşmez; tahsilat `POST /dispatch`'te yapılır.
      parameters:
      - explode: false
        in: path
        name: demandId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/_api_v1_demands__demandId__documents_upload_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_demands__demandId__documents_post_201_response"
          description: Belge yüklendi
        "400":
          description: '`VALIDATION_FAIL` (dosya/idempotency_key/başlık eksik) veya
            `INVALID_DOC_KIND`.'
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_templates__id__get_404_response"
          description: Kayıt bulunamadı
        "409":
          description: |
            `ENVELOPE_MULTI_DOC_DISABLED` — bayrak kapalı.
            `IDEMPOTENT_REPLAY` — aynı `idempotency_key` daha önce kullanıldı,
            yeni belge yaratılmaz (gövdede mevcut belgenin `document`'ı döner).
            `DEMAND_NOT_EDITABLE` / `SIGNING_ALREADY_STARTED` /
            `ENVELOPE_ALREADY_DISPATCHED`: bkz. yukarıdaki uç.
        "413":
          description: '`FILE_TOO_LARGE` — 20 MB sınırı.'
        "415":
          description: Desteklenmeyen dosya türü.
        "422":
          description: '`IMAGE_DECODE_FAILED` — görsel çözümlenemedi.'
      summary: Zarfa dosya yükle (belge başına tek dosya)
      tags:
      - Demands
      x-required-scope: demands:write
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
